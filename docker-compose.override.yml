# Development overlay.
#
# `docker compose up` loads this automatically, so the default command a
# developer types gives the development experience. It is NOT loaded when the
# production shape is requested explicitly:
#
#     docker compose -f docker-compose.yml up -d
#
# What changes for development:
#   * the source tree is bind-mounted over /app, so an edit is picked up without
#     a rebuild (paired with gunicorn --reload);
#   * DEBUG is on, so the traceback page and the query log are available;
#   * MySQL and Redis publish their ports, so a host tool (a MySQL client, the
#     bench harness) can reach them directly;
#   * the web port is published to the host.
#
# The published host ports default to 3307/6380 rather than 3306/6379, because a
# machine that already runs a native MySQL or Redis on the standard ports would
# otherwise fail at `up` with "ports are not available" -- which is exactly the
# situation on the machine this was built against. The app containers still reach
# MySQL and Redis by service name over the compose network, so these host ports
# only matter to a host-side client. Override with MYSQL_HOST_PORT /
# REDIS_HOST_PORT / WEB_HOST_PORT if you want different ones.
#
# None of this belongs in production: a bind-mounted source tree defeats the
# point of an immutable image, and DEBUG leaks internals.

services:
  mysql:
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"

  redis:
    ports:
      - "${REDIS_HOST_PORT:-6380}:6379"

  migrate:
    volumes:
      - .:/app

  web:
    environment:
      DJANGO_DEBUG: "True"
    command:
      - gunicorn
      - config.wsgi:application
      - --bind
      - 0.0.0.0:8000
      - --reload
      - --workers
      - "1"
      - --timeout
      - "120"
      - --access-logfile
      - "-"
      - --error-logfile
      - "-"
    volumes:
      - .:/app
    ports:
      - "${WEB_HOST_PORT:-8000}:8000"

  worker:
    volumes:
      - .:/app
